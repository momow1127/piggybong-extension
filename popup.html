<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Piggy Bong - Fan Style Check</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="popup-content">
    <!-- Header with logo and brand -->
    <div class="header">
      <div class="brand">
        <img src="piggybong.png" alt="Piggy Bong" class="logo">
        <span class="brand-name">Piggy Bong</span>
      </div>
    </div>

    <!-- Main content area -->
    <div class="content">
      <!-- Report/Instructions Card -->
      <div id="report-card" class="card">
        <div id="report-container" class="report-content">
          Navigate to your K-pop cart, then click below to discover your Fan Style! 🐷✨
        </div>
      </div>

      <!-- Action Button -->
      <button id="runCheckBtn" class="action-button">
        Should I Buy This?
      </button>

      <!-- Context info (hidden by default) -->
      <div id="context-area" class="context-info"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
