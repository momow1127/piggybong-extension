<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    h2 { margin-top: 0; color: #333; }
    button {
      background: #5D2CEE;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin: 10px 0;
    }
    button:hover { background: #4A23BD; }
    .info {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h2>🔍 Gemini Nano Service Worker Test</h2>

  <div class="info">
    <strong>Purpose:</strong> Test if Gemini Nano API works in Chrome extension service worker context (where Piggy Bong uses it).
  </div>

  <button onclick="testGemini()">Test Gemini in Service Worker</button>
  <button onclick="openServiceWorkerConsole()">Open Service Worker Console</button>
  <button onclick="openBackgroundPage()">Open Background Page Inspector</button>

  <div id="result"></div>

  <div class="info" style="margin-top: 20px;">
    <strong>Instructions:</strong>
    <ol style="margin: 8px 0; padding-left: 20px;">
      <li>Click "Open Service Worker Console"</li>
      <li>Look for console logs showing API availability</li>
      <li>Check if any AI endpoints are found</li>
    </ol>
  </div>

  <script src="popup.js"></script>
</body>
</html>
